name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # --legacy-peer-deps: same semantics pi uses to install packages (peer
      # declarations are metadata; the host provides them at runtime).
      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      - name: builder — fixture parity vs the Python oracle
        run: |
          set -e
          F=/tmp/idx-fixture
          mkdir -p "$F"
          printf '# Alpha Heading\nbody\n' > "$F/alpha.md"
          printf '> quote first\n# Beta Heading\nbody\n' > "$F/beta-quote.md"
          printf -- '---\n# Gamma Heading\nbody\n' > "$F/gamma-dash.md"
          printf '# Café 中文 éèê\nbody\n' > "$F/utf8-cjk.md"
          printf '' > "$F/empty.md"
          python3 -c "open('$F/longdesc.md','w').write('# ' + 'x'*300 + '\nbody\n')"
          printf 'no heading here\nplain lines\n' > "$F/noheading.md"
          printf '# Unreferenced\nbody\n' > "$F/zeta.md"
          cat > "$F/INDEX.md" <<'EOF'
          # Memory Index

          - Deploy runbook, wrapped over
            two lines → `memory/alpha.md`
          - Two refs in one bullet `memory/longdesc.md`
            and `memory/utf8-cjk.md` here
          - Beta → `memory/beta-quote.md`

          # Another Section

          - Gamma `memory/gamma-dash.md` trailing
          EOF
          chk() {
            python3 scripts/build-index.py --dir "$F" --out /tmp/py.json "$@" >/dev/null 2>&1; pe=$?
            node   scripts/build-index.mjs --dir "$F" --out /tmp/js.json "$@" >/dev/null 2>&1; je=$?
            [ "$pe" = "$je" ] || { echo "exit mismatch ($pe vs $je) for: $*"; exit 1; }
            if [ "$pe" = 0 ]; then cmp /tmp/py.json /tmp/js.json || { echo "output mismatch for: $*"; exit 1; }; fi
            echo "parity OK (exit $pe): $*"
          }
          chk
          chk --index-file "$F/INDEX.md"
          chk --index-file "$F/INDEX.md" --exclude '[ab]*.md'
          chk --index-file "$F/INDEX.md" --exclude zeta.md --exclude longdesc.md
          chk --exclude 'e*.md'
          chk --exclude 'draft-*'

      - name: pack hygiene (no pyc, no caches)
        run: |
          tarball=$(npm pack --silent 2>/dev/null | tail -n 1)
          if tar -tzf "$tarball" | grep -E "\\.pyc|__pycache__"; then
            echo "FAIL: cache artifacts in tarball"
            exit 1
          fi
          echo "pack clean — tarball artifact verified directly"

      - name: clean-room install from packed tarball
        run: |
          set -e
          tarball=$(npm pack --silent 2>/dev/null | tail -n 1)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$tarball" --legacy-peer-deps
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const root = "node_modules/@daxzeit/pi-jev-vcc-memory-relevance";
            const pkg = JSON.parse(readFileSync(root + "/package.json", "utf8"));
            if (pkg.name !== "@daxzeit/pi-jev-vcc-memory-relevance") throw new Error("wrong package name");
            if (!existsSync(root + "/jev-relevance.ts")) throw new Error("extension missing");
            if (!existsSync(root + "/scripts/build-index.mjs")) throw new Error("index builder missing");
            if (pkg.pi?.extensions?.[0] !== "./jev-relevance.ts") throw new Error("Pi extension metadata missing");
            if (pkg.pi?.skills?.[0] !== "./jev") throw new Error("Pi skill metadata missing");
            console.log("clean-room package install OK");
          '
